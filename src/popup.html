<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Subtitle Scaler</title>
  </head>
  <body>
    <header>
      <h1>Subtitle Scaler</h1>
      <label class="toggle">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <div class="fields">
      <label class="field">
        <span class="label">Size <output id="scale-out"></output></span>
        <input type="range" id="scale" min="1.5" max="12" step="0.1" />
        <span class="hint">% of the video's height</span>
      </label>

      <label class="field">
        <span class="label">Max width <output id="maxWidth-out"></output></span>
        <input type="range" id="maxWidth" min="40" max="100" step="1" />
        <span class="hint">lower this for 4:3 shows with black side bars</span>
      </label>

      <label class="field">
        <span class="label">Background <output id="bgOpacity-out"></output></span>
        <input type="range" id="bgOpacity" min="0" max="90" step="5" />
      </label>

      <label class="check">
        <input type="checkbox" id="shadow" />
        <span>Drop shadow</span>
      </label>
    </div>

    <footer>
      <div id="status" class="status">Checking…</div>
      <div class="actions">
        <button id="copy" type="button" hidden>Copy report</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
